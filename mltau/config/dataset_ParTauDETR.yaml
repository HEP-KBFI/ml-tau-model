dataset:
    max_cands: 20
    num_features: 17
    # Lifetime input features: [signed dz, dz significance, signed dxy, dxy
    # significance], with significance = IP / IP_error and all four 0 for
    # neutral candidates. use_log_significance=true instead uses
    # log(abs(IP) / IP_error), for checkpoints trained with that definition.
    # A positive transform_scale replaces each signed IP with
    # 2 * arctan(transform_scale * IP) / pi; zero or a negative value leaves
    # it unchanged. For example:
    #   dataset.impact_parameter_features.transform_scale=30
    impact_parameter_features:
        use_log_significance:  true
        transform_scale: 0.0
    # Target slots per jet, and (by interpolation) the number of decoder
    # queries. Measured over all 5.3M signal jets of the 0915 production with
    # check_query_budget.py: after the meson-class filter no tau has more than
    # 5 daughters (DM 4 and DM 12 reach exactly 5), so 6 is one slot of margin,
    # not a requirement. Fewer queries make each one count more; see
    # model.detr.loss.eos_coef before changing this.
    max_tau_daughters: 5
    # Charged daughters: pT threshold; neutral daughters: total momentum threshold.
    # Negative thresholds disable the respective cut. Fit-stage jets whose tau
    # charge or decay mode changes after cutting are excluded. The stored tau
    # 4-momentum remains inclusive when cuts are enabled.
    tau_daughter_charged_pt_cut: 0.1
    tau_daughter_neutral_p_cut: 0.5
    # Apply cls_weight to the tau-ID loss; daughter reconstruction is unweighted.
    use_cls_weights: true
    data_dir: /scratch/persistent/karl/ml-tau/1103_ParTauDETR_dataset

    # Meson classes for daughter one-hot encoding. Mapping order defines class
    # indices and charges defines valid charge-head combinations. All unlisted
    # decay products are discarded before target padding/truncation.
    tau_daughter_pdg_ids:
        charged:
            pdg_ids: [211, 321] # pi+/-, K+/-
            charges: [-1, 1]
        neutral:
            pdg_ids: [111, 221, 130] # pi0, eta -> yy, K_L0
            charges: [0]

    # Cap how many jets each sample contributes to train+val. Keys are the
    # filename prefixes before "_train" (e.g. z_train_0003.parquet -> "z").
    # Omit a sample or set it to null to use everything. Selection is
    # deterministic given selection_seed, and the chosen counts are printed at
    # startup, so a run is reproducible from the config alone. Never applied to
    # the test set.
    max_jets_per_sample:
        z: null
        qq: 10_000_000
        mm: null
        bhabha: null
    # Class 0 is the combined background of the samples listed under
    # background_classes.background (qq, mm and bhabha below). Hadronic tau,
    # tau electron and tau muon remain classes 1, 2 and 3. Additional groups
    # get classes 4 and up; move samples there to classify them separately.
    # For example, background: [qq], leptonic_background: [mm, bhabha] gives
    # five classes. background: [qq], mm: [mm], bhabha: [bhabha] gives six.
    background_classes:
        background: [qq, mm, bhabha]
    selection_seed: 42

    relative_sizes:
        train: 0.7
        val: 0.1
        test: 0.2
