training:
  debug_run: False
  lr: 0.001
  model:
    name: MultiParTau  # MultiParTau | SingleParTau
    task: is_tau       # SingleParTau only: is_tau | charge | decay_mode | kinematics
  trainer:
    max_epochs: 100

  task_weights:
    tau_id: 1.0
    charge: 1.0
    decay_mode: 1.0
    kinematics: 2.0  # higher weight → larger gradient magnitude → harder to cancel by PCGrad

  kinematics_lr_multiplier: 3.0  # LR multiplier for regression_head + cls_token_kinematics only
                                  # (was 10.0 — too aggressive, causes early plateau)

  # Phase-2 kinematics fine-tuning: at this epoch the shared backbone and
  # cls_token_shared are frozen and only cls_token_kinematics + regression_head
  # continue training.  Set to null to disable (single-phase training).
  # Rule of thumb: set to ~60-70 % of max_epochs, after classification tasks plateau.
  phase2_start_epoch: 30  # kinematics tends to plateau ~epoch 24; restart its LR here

  dataloader:
    batch_size: 12288
    num_dataloader_workers: 1
    prefetch_factor: 100

  input_scaling:
    enabled: false
    scaler_path: ${output_dir}/scaler/cand_feature_scaler.npz
    continuous_feature_indices: [0, 1, 2, 3, 4, 5, 6, 13, 14, 15, 16]