training:
    debug_run: False
    lr: 0.001
    model:
        name: MultiParTau # MultiParTau | SingleParTau
        task: is_tau # SingleParTau only: is_tau | charge | decay_mode | kinematics
    trainer:
        max_epochs: 250
        # "gpu" fails loudly if no CUDA device is visible. "auto" silently falls
        # back to CPU, which looks like a working-but-inexplicably-slow run.
        accelerator: gpu
        devices: 1
        # fp16 AMP is CUDA-only; use bf16-mixed if you ever run on CPU.
        precision: 16-mixed

        # Validation runs at epoch end by default. With a multi-hour epoch that
        # means no val_losses/* metrics and no ModelCheckpoint(monitor=
        # "val_losses/loss") for hours. Validate every N training steps instead.
        # null -> end of epoch only.
        val_check_interval: 500
        # Cap each validation pass: the full val split is ~12.5% of the dataset,
        # which would cost several hundred steps every time. null -> all of it.
        limit_val_batches: 50
        # A couple of sanity batches before training surfaces a broken val path
        # in seconds rather than after the first epoch.
        num_sanity_val_steps: 2

    task_weights:
        tau_id: 1.0
        charge: 1.0
        decay_mode: 1.0
        kinematics: 2.0 # higher weight → larger gradient magnitude

    task_weight_scheduler:
        enabled: true
        monitor_tasks: ["charge", "decay_mode"]
        patience: 3
        factor: 0.5
        min_weight: 0.05

    dataloader:
        batch_size: 12288
        # Keep this a couple below #SBATCH --cpus-per-task in train-gpu-DETR.sh:
        # the main process also needs cores for the CPU-side Hungarian matching
        # and the pin_memory thread. Clamped automatically to the real cpuset.
        num_dataloader_workers: 10
        prefetch_factor: 2

        # Keep one pyarrow handle per file per worker so the Parquet footer is
        # parsed once instead of on every read. With ~34k row groups per file
        # that is the difference between seconds and ~90 s per read.
        cache_parquet_handles: true

        # Consecutive row groups coalesced into a single read. Amortises the
        # per-read fixed cost; 100 x 1024 ~= 100k jets per read. Set to 1 once
        # the input files are repacked to ~100k-row row groups, otherwise a read
        # becomes millions of jets and the worker runs out of memory.
        row_groups_per_read: 100

        # Reads held in memory at once. >1 is what puts signal and background in
        # the same batch, at proportionally more worker RAM. Do not set to 1: a
        # single read is one file, hence one class.
        mixing_reads: 2

    input_scaling:
        enabled: false
        scaler_path: ${output_dir}/scaler/cand_feature_scaler.npz
        continuous_feature_indices: [0, 1, 2, 3, 4, 5, 6, 13, 14, 15, 16]
