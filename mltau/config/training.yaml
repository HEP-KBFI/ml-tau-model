training:
  debug_run: False
  lr: 0.001
  model:
    name: MultiParTau  # MultiParTau | SingleParTau
    backbone: ParT    # ParT | Mixer
    task: is_tau       # SingleParTau only: is_tau | charge | decay_mode | kinematics
    num_layers: 2
    num_heads: 8
    num_cls_layers: 2
    embed_dims: [256, 512, 256]
    pair_embed_dims: [64, 64, 64]
  trainer:
    max_epochs: 100

  task_weights:
    tau_id: 1.0
    charge: 1.0
    decay_mode: 1.0
    kinematics: 2.0  # higher weight → larger gradient magnitude

  task_weight_scheduler:
    enabled: true
    monitor_tasks: ["charge", "decay_mode"]
    patience: 3
    factor: 0.5
    min_weight: 0.05

  dataloader:
    type: parquet # preprocessed | parquet
    batch_size: 12288
    num_dataloader_workers: 4
    prefetch_factor: 100
    row_groups_per_read: 16

  input_scaling:
    enabled: false
    scaler_path: ${output_dir}/scaler/cand_feature_scaler.npz
    continuous_feature_indices: [0, 1, 2, 3, 4, 5, 6, 13, 14, 15, 16]

distillation:
  # Representation distillation, low-LR head warmup, then differential-LR
  # joint fine-tuning of the student backbone and task head.
  representation_epochs: 20
  head_warmup_epochs: 5
  representation_lr: 0.001
  head_warmup_lr: 0.0001
  joint_head_lr: 0.0003
  joint_backbone_lr: 0.00002
  global_loss_weight: 1.0
  token_loss_weight: 1.0
  masked_token_loss_weight: 1.0
  mask_probability: 0.3
  output_distill_loss_weight: 1.0
  adaptation_feature_loss_weight: 0.1
  enable_input_scaling: true

teacher_checkpoint: null
