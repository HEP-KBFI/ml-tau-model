training:
  debug_run: False
  lr: 0.0001
  model:
    name: MultiParTau  # MultiParTau | SingleParTau
    task: is_tau       # SingleParTau only: is_tau | charge | decay_mode | kinematics
  trainer:
    max_epochs: 100

  task_weights:
    tau_id: 1.0
    charge: 1.0
    decay_mode: 1.0
    kinematics: 1.0

  dataloader:
    batch_size: 12288 #10240 #2048 #4096
    num_dataloader_workers: 8
    prefetch_factor: 100

  input_scaling:
    enabled: false
    scaler_path: ${output_dir}/scaler/cand_feature_scaler.npz
    continuous_feature_indices: [0, 1, 2, 3, 4, 5, 6, 13, 14, 15, 16]